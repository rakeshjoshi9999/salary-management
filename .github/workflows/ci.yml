name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts a real Postgres; the ubuntu runner ships
      # with a working Docker daemon, so nothing extra is needed here.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      # Coverage is reported, never enforced (ADR-035).
      - name: Publish coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      # Totals from JaCoCo's CSV. The header check makes a column change fail loudly.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('backend/target/site/jacoco/jacoco.csv') != '' }}
        working-directory: backend/target/site/jacoco
        run: |
          head -1 jacoco.csv | grep -q '^GROUP,PACKAGE,CLASS,INSTRUCTION_MISSED,INSTRUCTION_COVERED,BRANCH_MISSED,BRANCH_COVERED,LINE_MISSED,LINE_COVERED,' \
            || { echo "::error::Unexpected jacoco.csv columns"; exit 1; }
          awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
            function pct(c, m) { return (c + m) ? sprintf("%.1f%% (%d/%d)", 100 * c / (c + m), c, c + m) : "n/a" }
            END {
              print "### Backend coverage"
              print "| Lines | Branches |"
              print "|---|---|"
              print "| " pct(lc, lm) " | " pct(bc, bm) " |"
            }' jacoco.csv >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vitest runs in jsdom, so no browser binary is needed on the runner.
      - name: Run tests
        working-directory: frontend
        run: npx ng test --watch=false --coverage

      # Coverage is reported, never enforced (ADR-035).
      - name: Publish coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/salary-management-ui/coverage-summary.json') != '' }}
        working-directory: frontend
        run: |
          node -e '
            const t = require("./coverage/salary-management-ui/coverage-summary.json").total;
            const f = (m) => m.pct + "% (" + m.covered + "/" + m.total + ")";
            console.log("### Frontend coverage");
            console.log("| Lines | Branches |");
            console.log("|---|---|");
            console.log("| " + f(t.lines) + " | " + f(t.branches) + " |");
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        working-directory: frontend
        run: npx ng build

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Runs even when lint fails, so one push shows both problems.
      - name: Check formatting
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run format:check
