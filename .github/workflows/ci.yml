name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts a real Postgres; the ubuntu runner ships
      # with a working Docker daemon, so nothing extra is needed here.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
