<!--
  Application shell: product identity lives here, routed views render into the
  outlet and own their own content. Keeping the single h1 in the shell means a
  routed page cannot accidentally introduce a second one.
-->
<div class="min-h-screen bg-surface-50 pb-16">
  <header class="mx-auto max-w-2xl px-6 pt-16">
    <h1 class="text-2xl font-semibold tracking-tight text-surface-900">{{ title() }}</h1>
    <p class="mt-2 text-sm text-surface-600">
      Walking skeleton — no features yet. This page exists to prove the browser can reach the API,
      and the API its database.
    </p>
  </header>

  <router-outlet />
</div>
