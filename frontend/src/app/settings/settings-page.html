<section class="mx-auto max-w-2xl px-4">
  <app-page-header heading="Settings" />

  <div class="rounded-md border border-line bg-card p-6">
    @if (status() === 'error') {
      <app-state-panel
        data-testid="settings-error"
        state="error"
        message="Couldn't load settings"
        actionId="settings-retry"
        (action)="load()"
      />
    } @else if (status() === 'loading' || !reference.ready()) {
      <div data-testid="settings-skeleton" aria-busy="true" class="flex flex-col gap-3">
        <span class="sr-only">Loading settings</span>
        <p-skeleton height="1rem" width="40%" />
        <p-skeleton height="2.5rem" />
      </div>
    } @else {
      <form class="flex flex-col gap-2" (submit)="$event.preventDefault(); save()">
        <label for="settings-country" class="text-sm font-medium text-ink">
          Default country for Insights
        </label>
        <div class="flex flex-col gap-2 sm:flex-row">
          <select
            id="settings-country"
            data-testid="settings-country"
            class="flex-1 rounded-md border border-line-strong bg-card px-2 py-2 text-sm"
            aria-describedby="settings-currency"
            [disabled]="saving()"
            (change)="choose($any($event.target).value)"
          >
            <!-- Selected only if the saved code is not a supported country, so nothing wrong looks chosen. -->
            <option value="" disabled [selected]="!currency()">Choose a country</option>
            @for (country of reference.countries(); track country.code) {
              <option [value]="country.code" [selected]="country.code === selected()">
                {{ country.name }} ({{ country.currency }})
              </option>
            }
          </select>
          <button
            pButton
            type="submit"
            data-testid="settings-save"
            [loading]="saving()"
            [disabled]="!changed() || saving()"
          >
            Save
          </button>
        </div>
        <p id="settings-currency" data-testid="settings-currency" class="text-sm text-ink-muted">
          Currency follows the country: {{ currency() }}
        </p>
      </form>
    }
  </div>
</section>
