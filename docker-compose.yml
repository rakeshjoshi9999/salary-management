# Local Postgres for development only. Pinned to the major version Neon
# provisioned, so local, CI and production share SQL semantics.
# Tests do not use this: Testcontainers starts its own container per run.
services:
  postgres:
    image: postgres:18-alpine
    container_name: salary-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salary}
      POSTGRES_USER: ${POSTGRES_USER:-salary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salary}
    ports:
      # Host 5433: this machine already runs Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images keep data in a major-version subdirectory and expect a
      # single mount one level up. Mounting .../data instead makes the container
      # refuse to start, reporting an "unused mount/volume".
      - salary-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salary} -d ${POSTGRES_DB:-salary}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  salary-pgdata:
