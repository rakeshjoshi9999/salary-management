spring.application.name=salary-management

# Datasource. Environment variables win; the defaults target docker compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/salary}
spring.datasource.username=${DB_USERNAME:salary}
spring.datasource.password=${DB_PASSWORD:salary}

# Flyway owns the schema outright. No migration files exist yet (ADR-001);
# Flyway still creates its history table, which is what proves write access.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Entities never leave the service layer, so nothing should lazy-load during rendering.
spring.jpa.open-in-view=false

# Render supplies PORT at runtime. Local default 8081, not the conventional
# 8080, which is occupied on the development machine.
server.port=${PORT:8081}

# The deployed frontend is on another origin, so the browser reads nothing this
# API does not explicitly permit. Never hardcoded: every Vercel preview gets a
# generated hostname, so the allowlist has to be configuration (ADR-003).
# Default is the Angular dev server, so `ng serve` works with no .env at all.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator endpoints carry their own CORS configuration, entirely separate from
# the MVC one in CorsConfig. The health page reads /actuator/health from the
# browser, so without this the request is blocked no matter what MVC allows.
management.endpoints.web.cors.allowed-origins=${cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET
