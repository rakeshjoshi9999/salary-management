# Render Blueprint.
#
# Create the service once from this file: Dashboard -> New -> Blueprint ->
# select this repository. Everything except the secret values lives here,
# version-controlled and reviewable, rather than clicked into a dashboard
# where nobody can audit it later.
services:
  - type: web
    name: salary-management-api
    runtime: docker

    # Monorepo: the Dockerfile and its build context both live under backend/.
    rootDir: backend

    # Must match the Neon region. A mismatch puts an ocean between the API and
    # its database on every single query.
    region: singapore

    plan: free
    branch: main

    # Deploy only once CI is green on the commit (ADR-034), as stage does. A red
    # commit that reaches main stays undeployed instead of replacing a working API.
    autoDeployTrigger: checksPass

    # Render polls this to decide whether a deploy succeeded. The status
    # aggregates the datasource health indicator, so it cannot report UP while
    # the database is unreachable.
    healthCheckPath: /actuator/health

    envVars:
      # sync: false means Render prompts for the value during Blueprint
      # creation and keeps it itself. No credential enters this repository.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Read by the CORS configuration in task 1.9. Set it to the Vercel
      # production origin. Deliberately not hardcoded: preview deployments get
      # generated hostnames, so the allowlist has to be configurable.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

    # PORT is deliberately absent. Render injects it and the app reads it;
    # setting it by hand pins the container to the wrong port.

  # Stage (ADR-030, ADR-031): the same image, tracking the stage branch, with its
  # own Neon branch database and its own CORS origin. It deploys only once CI is
  # green on the commit, so stage never runs code that failed its tests.
  - type: web
    name: salary-management-api-stage
    runtime: docker
    rootDir: backend
    region: singapore
    plan: free
    branch: stage
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health

    envVars:
      # The Neon stage branch's pooled connection, never production's.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # The stage Vercel alias only.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
